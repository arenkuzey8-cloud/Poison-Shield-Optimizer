
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: ./poison-shield-optimizer
        run: gradle build --no-daemon

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: poison-shield-optimizer/build/libs/*.jar
          if-no-files-found: error
